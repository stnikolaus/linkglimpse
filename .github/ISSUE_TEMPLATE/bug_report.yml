name: Bug report
description: Report a reproducible LinkGlimpse problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private URLs, or security vulnerabilities. Report vulnerabilities through the Security tab.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Website
        - Metadata API
        - npm CLI
        - Chrome extension
        - Firefox extension
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and a public test URL if safe.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js version, or deployment details.
