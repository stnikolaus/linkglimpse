name: Publish CLI

on:
  push:
    tags:
      - cli-v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node --test packages/cli/test/*.test.mjs
      - run: npm publish ./packages/cli --access public
