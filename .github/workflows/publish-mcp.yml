name: Publish MCP server

on:
  push:
    tags:
      - mcp-v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter linkglimpse-mcp test
      - run: pnpm --filter linkglimpse-mcp publish --access public --no-git-checks
      - name: Install MCP Registry publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the official MCP Registry
        working-directory: packages/mcp
        run: |
          ../../mcp-publisher login github-oidc
          ../../mcp-publisher publish
